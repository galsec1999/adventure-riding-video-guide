# Document version: 1.1.0 — product 3.4.0
name: Validate site and PWA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install validator dependency
        run: python -m pip install -r requirements-ci.txt

      - name: Validate canonical data and publication mirror
        run: |
          python tools/validate_data.py --expected-count 425
          python tools/verify_site_sync.py

      - name: Validate 425 full videos, audited Shorts, semantic index, standalone, manifest, icons and subpath safety
        run: python tools/validate_pwa.py --site site --schema documentation/video.schema.json --expected-count 425

      - name: Run Node tests
        run: |
          npm test
          node tools/search_acceptance.mjs --report reports/site-upgrade-v3/search-acceptance-ci.json

      - name: Run Python maintenance tests
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Check JavaScript syntax
        shell: bash
        run: |
          find site/assets/js -name '*.js' -print0 | xargs -0 -n1 node --check
          node --check site/service-worker.js

      - name: Check whitespace errors
        run: git diff --check HEAD^ HEAD
