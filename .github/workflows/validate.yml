name: Validate site and PWA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install validator dependency
        run: python -m pip install "jsonschema==4.26.0"

      - name: Validate 450 records, manifest, icons and subpath safety
        run: python tools/validate_pwa.py --site site --schema documentation/video.schema.json --expected-count 450

      - name: Run Node tests
        run: npm test

      - name: Check JavaScript syntax
        shell: bash
        run: |
          find site/assets/js -name '*.js' -print0 | xargs -0 -n1 node --check
          node --check site/service-worker.js

      - name: Check whitespace errors
        run: git diff --check
